<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("vt_theme")||"dark";if(localStorage.getItem("vt_motion")==="0")document.documentElement.dataset.motion="off"}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitality · Acesso</title>
<link rel="icon" type="image/png" href="lib/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/tokens.css?v=5">
<link rel="stylesheet" href="lib/theme.css?v=52">
<link rel="stylesheet" href="lib/theme-ffx.css?v=13">
<link rel="stylesheet" href="lib/components.css?v=11">
<style>
  /* Login — "Latão calmo" (docs/DESIGN-v2-LATAO-CALMO.md §3.1): herói à esquerda, formulário de
     até 400px à direita; no celular uma coluna com o botão principal preso no rodapé */
  html,body{min-height:100%}
  body{background:var(--bg)}
  .wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .hero{display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-7);padding:var(--space-7);
    background:var(--surface-1);border-right:1px solid var(--border)}
  .brandline{display:flex;align-items:center;gap:var(--space-3);font-family:var(--disp);font-size:var(--fs-h3);letter-spacing:.14em;color:var(--text)}
  .brandline img{width:44px;height:22px;object-fit:contain}
  .hero-copy{max-width:520px}
  .hero-copy h1{margin:0 0 var(--space-4);font-family:var(--disp);font-weight:400;font-size:var(--fs-display);line-height:1.08;color:var(--text);text-wrap:balance}
  .hero-copy p{margin:0;font-size:17px;line-height:1.6;color:var(--text-2)}
  .hero-foot{font-size:var(--fs-small);color:var(--text-3)}
  .side{display:flex;align-items:center;justify-content:center;padding:var(--space-7) var(--space-5)}
  .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:var(--space-5)}
  .card > h2{margin:0;font-family:var(--disp);font-weight:400;font-size:var(--fs-h2);line-height:32px;color:var(--text)}
  .auth-tabs{margin-bottom:calc(var(--space-2) * -1)}
  .auth-tabs button{flex:1}
  #form{display:flex;flex-direction:column;gap:var(--space-4)}
  #form[aria-busy="true"] .fld{opacity:.7}
  .lbl-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
  .lbl-row .btn.tertiary{font-family:var(--serif);font-size:var(--fs-small);font-weight:500;letter-spacing:0;text-transform:none}
  .pw-wrap{position:relative}
  .pw-wrap input{width:100%;padding-right:84px}
  .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:32px;padding:0 var(--space-3);border:0;background:transparent;cursor:pointer;
    font-family:var(--serif);font-size:var(--fs-small);font-weight:600;color:var(--primary)}
  .pw-toggle:hover{color:var(--primary-hover);text-decoration:underline;text-underline-offset:4px}
  #submit{width:100%;height:44px}
  .or{display:flex;align-items:center;gap:var(--space-3);font-size:var(--fs-small);color:var(--text-3)}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
  .gbtn{width:100%;height:44px}
  .gbtn .gicon{width:18px;height:18px;flex:0 0 auto}
  /* aviso em linha acima dos campos (não é toast) */
  #msg{display:none;position:static;transform:none;inset:auto;width:auto;max-width:none;margin:0;z-index:auto}
  #msg.show{display:flex}
  #form .fld{margin:0}
  #form .fld input,#form .pw-wrap{margin:0}
  #msg{text-align:left}
  .back-link{width:auto}
  .lbl-row .btn{width:auto}
  .card > h2{display:none}
  .card.titled > h2{display:block}
  .back-link{align-self:flex-start}
  .pw-strength-row{display:flex;align-items:center;gap:var(--space-3);margin-top:2px}
  .pw-strength{display:flex;gap:4px;flex:1}
  .pw-strength i{flex:1;height:4px;background:var(--surface-3);transition:background var(--t)}
  .pw-strength.weak i:nth-child(1){background:var(--danger)}
  .pw-strength.ok i:nth-child(1),.pw-strength.ok i:nth-child(2){background:var(--warning)}
  .pw-strength.strong i{background:var(--success)}
  .pw-strength-label{font-size:var(--fs-small);color:var(--text-3);flex-shrink:0;min-width:44px;text-align:right}
  @media (max-width:860px){
    .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .hero{gap:var(--space-5);padding:var(--space-5) var(--space-4);border-right:0;border-bottom:1px solid var(--border)}
    .hero-copy h1{font-size:32px}
    .hero-copy p{font-size:15px}
    .hero-foot{display:none}
    .side{align-items:flex-start;padding:var(--space-5) var(--space-4) 0}
    .card{gap:var(--space-4)}
    /* celular: o primário fica no rodapé, sempre ao alcance do polegar */
    #submit{position:sticky;bottom:0;height:48px;margin-top:var(--space-2);box-shadow:0 -12px 16px var(--bg)}
    .gbtn{height:48px}
  }
</style>
</head>
<body>
<div id="fallback"></div>

<div class="wrap">
  <section class="hero" aria-label="Vitality">
    <div class="brandline"><img src="lib/logo.png" alt="" class="mark logo">VITALITY</div>
    <div class="hero-copy">
      <h1>Sua campanha, com as suas regras.</h1>
      <p>Monte o sistema do seu RPG — status, classes, árvores e itens — e jogue com o grupo numa mesa virtual com fichas, dados e trilha sonora.</p>
    </div>
    <div class="hero-foot">Mesa virtual para RPG de mesa</div>
  </section>

  <main class="side">
  <div class="card" id="auth-card">
    <h2 id="auth-title">Entrar</h2>
    <div class="sub-tabs auth-tabs" id="auth-menu" role="tablist" aria-label="Acesso">
      <button type="button" role="tab" id="tab-signin" class="on" aria-selected="true" aria-controls="form" onclick="setMode('signin')">Entrar</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false" aria-controls="form" tabindex="-1" onclick="setMode('signup')">Criar conta</button>
    </div>

    <div id="msg" class="msg"></div>

    <form id="form" role="tabpanel" aria-labelledby="tab-signin" onsubmit="return submitForm(event)">
      <div class="fld" id="fld-name" style="display:none">
        <label for="name">Nome de exibição</label>
        <input id="name" type="text" autocomplete="nickname" placeholder="Ex.: Aurora">
        <div class="fld-help">É assim que o grupo vai te ver na mesa.</div>
      </div>
      <div class="fld" id="fld-email">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="Ex.: voce@exemplo.com" aria-describedby="msg">
      </div>
      <div class="fld" id="fld-password">
        <div class="lbl-row"><label for="password" id="password-label">Senha</label>
          <button type="button" class="btn tertiary" id="forgot-link" onclick="setMode('recover')">Esqueci a senha</button></div>
        <div class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo de 6 caracteres" oninput="onPasswordInput()">
          <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePw()" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
        </div>
        <div class="pw-strength-row" id="pw-strength-row" style="display:none">
          <div class="pw-strength" id="pw-strength"><i></i><i></i><i></i></div>
          <span class="pw-strength-label" id="pw-strength-label"></span>
        </div>
      </div>
      <div class="fld" id="fld-confirm" style="display:none">
        <label for="password2">Confirmar senha</label>
        <input id="password2" type="password" autocomplete="new-password" minlength="6" placeholder="Repita a senha" aria-describedby="password2-err">
        <div class="fld-err" id="password2-err">As senhas não são iguais.</div>
      </div>
      <button type="submit" id="submit" class="btn go">
        <span class="spin"></span><span id="submit-label">Entrar</span>
      </button>
      <button type="button" class="btn tertiary back-link" id="back-to-signin" style="display:none" onclick="setMode('signin')">← Voltar para Entrar</button>
    </form>

    <div class="or" id="divider">ou</div>

    <button type="button" class="btn gbtn" id="google" onclick="googleLogin()">
      <svg class="gicon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.05l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continuar com Google
    </button>
  </div>
  </main>
</div>

<script type="module">
import { signInWithPassword, signUp, signInWithGoogle, getSession, resetPasswordForEmail, updatePassword, onAuthChange } from './lib/db.js?v=42';
import './lib/ui.js?v=10';


const APP_URL = new URL('app.html', window.location.href).href;
// `next` volta pro app.html/mesa.html/etc. de onde o usuário veio (só caminhos internos, nunca URL externa).
const NEXT = (() => {
  const raw = new URLSearchParams(location.search).get('next');
  if (raw && raw.startsWith('/') && !raw.startsWith('//') && !raw.includes('://')) return raw;
  return null;
})();
const DEST = NEXT ? new URL(NEXT, window.location.href).href : APP_URL;
let mode = 'signin';

// Provider Google habilitado no painel do Supabase (Authentication > Providers > Google,
// com Client ID/Secret do Google Cloud) — ver histórico do commit pro estado "em breve" anterior.
const GOOGLE_ENABLED = true;

const $ = (id) => document.getElementById(id);
const msgEl = $('msg');
// abas sublinhadas Entrar / Criar conta: ←/→ trocam de aba (padrão de tablist horizontal)
$('auth-menu').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const next = mode === 'signin' ? 'signup' : 'signin';
  setMode(next); $('tab-' + next).focus();
});
const syncAuthTabindex = () => ['signin', 'signup'].forEach((m) => { $('tab-' + m).tabIndex = mode === m ? 0 : -1; });

function showMsg(text, kind) {
  msgEl.textContent = text;
  msgEl.className = 'msg show ' + (kind || 'err');
}
function clearMsg() { msgEl.className = 'msg'; }

// carregando: rótulo com verbo no gerúndio + campos travados (o que já foi digitado nunca some)
const BUSY_LABEL = { signin: 'Entrando…', signup: 'Criando conta…', recover: 'Enviando link…', reset: 'Salvando…' };
function setLoading(on) {
  const b = $('submit');
  b.classList.toggle('loading', on);
  b.disabled = on;
  $('google').disabled = on;
  $('form').setAttribute('aria-busy', String(on));
  $('form').querySelectorAll('input').forEach((i) => { i.readOnly = on; });
  $('submit-label').textContent = on ? BUSY_LABEL[mode] : SUBMIT_LABEL[mode];
}
// erro: aviso em linha acima dos campos + borda de erro no campo que precisa de correção
function markInvalid(ids) {
  ['email', 'password', 'password2', 'name'].forEach((id) => { const el = $(id); if (!el) return; const bad = ids.includes(id); el.classList.toggle('invalid', bad); el.setAttribute('aria-invalid', String(bad)); });
}

// 'signin'/'signup' são as duas abas normais; 'recover' pede só o email pra mandar o link de
// redefinição; 'reset' aparece sozinho (sem o usuário escolher) quando a página é aberta a partir
// do link daquele email — nesse modo as abas Entrar/Criar conta e o Google somem, já que não faz
// sentido nenhum dos dois enquanto está no meio da troca de senha
const SUBMIT_LABEL = { signin: 'Entrar', signup: 'Criar conta', recover: 'Enviar link de recuperação', reset: 'Salvar nova senha' };
window.setMode = (m) => {
  mode = m;
  clearMsg();
  const isAuthTab = m === 'signin' || m === 'signup';
  for (const [id, on] of [['tab-signin', m === 'signin'], ['tab-signup', m === 'signup']]) {
    $(id).classList.toggle('on', on);
    $(id).setAttribute('aria-selected', String(on));
  }
  if (isAuthTab) $('form').setAttribute('aria-labelledby', 'tab-' + m);
  else $('form').removeAttribute('aria-labelledby');
  syncAuthTabindex();
  $('auth-menu').style.display = isAuthTab ? '' : 'none';
  $('fld-name').style.display = m === 'signup' ? '' : 'none';
  $('fld-email').style.display = (m === 'signin' || m === 'signup' || m === 'recover') ? '' : 'none';
  $('fld-password').style.display = (m === 'signin' || m === 'signup' || m === 'reset') ? '' : 'none';
  $('password-label').textContent = m === 'reset' ? 'Nova senha' : 'Senha';
  $('fld-confirm').style.display = (m === 'signup' || m === 'reset') ? '' : 'none';
  $('forgot-link').style.display = m === 'signin' ? '' : 'none';
  $('back-to-signin').style.display = (m === 'recover') ? '' : 'none';
  $('pw-strength-row').style.display = (m === 'signup' || m === 'reset') ? '' : 'none';
  $('pw-strength').className = 'pw-strength';
  $('pw-strength-label').textContent = '';
  $('divider').style.display = isAuthTab ? '' : 'none';
  $('google').style.display = isAuthTab ? '' : 'none';
  $('email').required = m !== 'reset';
  $('password').required = m !== 'recover';
  $('password2').required = (m === 'signup' || m === 'reset');
  $('submit-label').textContent = SUBMIT_LABEL[m];
  $('auth-title').textContent = { signin: 'Entrar', signup: 'Criar conta', recover: 'Recuperar senha', reset: 'Nova senha' }[m];
  $('auth-card').classList.toggle('titled', !isAuthTab); // com as abas visíveis o título repetiria a aba
  markInvalid([]);
  $('password').setAttribute('autocomplete', m === 'signup' || m === 'reset' ? 'new-password' : 'current-password');
  if (m !== 'reset') { $('password').value = ''; $('password2').value = ''; }
};

window.onPasswordInput = () => {
  const v = $('password').value;
  const row = $('pw-strength-row'), el = $('pw-strength'), label = $('pw-strength-label');
  if (row.style.display === 'none') return;
  if (!v) { el.className = 'pw-strength'; label.textContent = ''; return; }
  let score = 0;
  if (v.length >= 6) score++;
  if (v.length >= 10 && /[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  if (v.length >= 10 && /[A-Z]/.test(v) && /[0-9]/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
  const tier = score <= 1 ? 'weak' : score === 2 ? 'ok' : 'strong';
  el.className = 'pw-strength ' + tier;
  label.textContent = tier === 'weak' ? 'Fraca' : tier === 'ok' ? 'Média' : 'Forte';
};

window.submitForm = (ev) => {
  ev.preventDefault();
  clearMsg();
  $('password2-err').classList.remove('show');
  const email = $('email').value.trim();
  const password = $('password').value;
  const password2 = $('password2').value;
  const name = $('name').value.trim();

  if ((mode === 'signup' || mode === 'reset') && password !== password2) {
    $('password2-err').classList.add('show');
    $('password2').focus();
    return false;
  }

  if (mode === 'recover') {
    setLoading(true);
    resetPasswordForEmail(email, new URL(location.pathname, location.href).href)
      .then(() => showMsg('Se esse email tiver conta, enviamos um link de recuperação pra ele.', 'ok'))
      .catch((err) => showMsg(translateError(err)))
      .finally(() => setLoading(false));
    return false;
  }

  if (mode === 'reset') {
    setLoading(true);
    updatePassword(password)
      .then(() => { window.location.href = DEST; })
      .catch((err) => { showMsg(translateError(err)); setLoading(false); });
    return false;
  }

  setLoading(true);
  const run = mode === 'signup'
    ? signUp(email, password, name)
    : signInWithPassword(email, password);

  run.then((data) => {
    if (mode === 'signup' && !data.session) {
      // confirmação de email ligada no projeto
      showMsg('Conta criada! Confirme o link enviado para seu email para entrar.', 'ok');
      setLoading(false);
      return;
    }
    window.location.href = DEST;
  }).catch((err) => {
    showMsg(translateError(err), 'err');
    markInvalid(errorFields(err));
    setLoading(false);
  });
  return false;
};
// qual campo o erro aponta (a borda vermelha mostra onde corrigir; o email digitado nunca é apagado)
function errorFields(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return ['email', 'password'];
  if (/User already registered|Email not confirmed|invalid.*email/i.test(m)) return ['email'];
  if (/Password should be at least/i.test(m)) return ['password'];
  return [];
}

// o Supabase detecta sozinho o token de recuperação na URL (detectSessionInUrl, já ligado pro
// Google) e dispara este evento — troca a tela pro modo "definir nova senha" sem o usuário ter
// feito nada além de clicar no link do email
onAuthChange((_session, event) => { if (event === 'PASSWORD_RECOVERY') setMode('reset'); });

window.togglePw = () => {
  const i = $('password'), b = $('pw-toggle');
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.textContent = show ? 'Ocultar' : 'Mostrar';
  b.setAttribute('aria-pressed', String(show));
  b.title = show ? 'Ocultar senha' : 'Mostrar senha';
  b.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
};

window.googleLogin = () => {
  clearMsg();
  if (!GOOGLE_ENABLED) {
    showMsg('Login com Google chega em breve. Por enquanto, entre com email e senha.', 'ok');
    return;
  }
  setLoading(true);
  signInWithGoogle(DEST).catch((err) => {
    showMsg(translateError(err), 'err');
    setLoading(false);
  });
};

function translateError(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return 'Email ou senha incorretos. Confira os dois e tente de novo.';
  if (/User already registered/i.test(m)) return 'Esse email já tem conta. Tente entrar.';
  if (/Password should be at least/i.test(m)) return 'A senha precisa de pelo menos 6 caracteres.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu email antes de entrar.';
  if (/provider is not enabled/i.test(m)) return 'Login com Google ainda não está habilitado no projeto.';
  return m;
}

// Link de recuperação de senha: o Supabase cria uma sessão temporária SÓ pra permitir trocar a
// senha — sem essa checagem, o redirecionamento automático (linha abaixo) mandaria a pessoa direto
// pro app antes de sequer ver o formulário de nova senha. `type=recovery` chega no hash da URL
// (mesmo mecanismo de detectSessionInUrl já usado pro retorno do Google).
if (/type=recovery/.test(location.hash)) setMode('reset');

// Já logado? vai direto pro destino (ou pro app, se não veio de nenhuma página específica) —
// exceto no meio de uma recuperação de senha, que também conta como "logado" tecnicamente.
getSession().then((s) => { if (s && mode !== 'reset') window.location.href = DEST; else if (!s) $('email').focus(); });
</script>
</body>
</html>
